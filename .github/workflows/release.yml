name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          path: desktop

      - uses: actions/checkout@v4
        with:
          repository: solyto/app
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install fpm
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y ruby ruby-dev build-essential && sudo gem install fpm

      - name: Set version from tag
        working-directory: desktop
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm pkg set version="$VERSION"

      - name: Build frontend (Linux/macOS)
        if: matrix.os != 'windows-latest'
        working-directory: desktop
        run: bash build.sh

      - name: Build frontend (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: desktop
        shell: pwsh
        run: |
          $src = "../app"
          $dst = "build-src"
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          Copy-Item $src $dst -Recurse -Exclude @(".svelte-kit", "build", "node_modules")
          Copy-Item "patch/svelte.config.js" "$dst/svelte.config.js" -Force
          Copy-Item "patch/package.json" "$dst/package.json" -Force
          Copy-Item "patch/layout.svelte" "$dst/src/routes/+layout.svelte" -Force
          Copy-Item "patch/TitleBar.svelte" "$dst/src/lib/components/ui/TitleBar.svelte" -Force
          Copy-Item "patch/app.d.ts" "$dst/src/app.d.ts" -Force
          cd $dst
          Remove-Item package-lock.json -ErrorAction SilentlyContinue
          npm install
          $env:PUBLIC_API_URL="https://api.solyto.app"
          npm run build

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build and publish
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          USE_SYSTEM_FPM: true
        run: npx electron-builder ${{ matrix.args }} --publish always
