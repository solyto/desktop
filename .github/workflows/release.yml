name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

  release:
    needs: create-release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          path: desktop

      - uses: actions/checkout@v4
        with:
          repository: solyto/app
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install fpm
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y ruby ruby-dev build-essential && sudo gem install fpm

      - name: Set version from tag
        working-directory: desktop
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm pkg set version="$VERSION"

      - name: Build frontend (Linux/macOS)
        if: matrix.os != 'windows-latest'
        working-directory: desktop
        run: bash build.sh

      - name: Build frontend (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: desktop
        shell: pwsh
        run: |
          $src = "../app"
          $dst = "build-src"
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          Copy-Item $src $dst -Recurse -Exclude @(".svelte-kit", "build", "node_modules")
          Copy-Item "patch/svelte.config.js" "$dst/svelte.config.js" -Force
          Copy-Item "patch/app.d.ts" "$dst/src/app.d.ts" -Force
          cd $dst
          # Desktop-only build dependency, matching build.sh: keep app's lockfile
          # (deterministic tree) and add the static adapter Electron needs.
          npm install --save-dev --save-exact @sveltejs/adapter-static@3.0.10
          $env:PUBLIC_API_URL="https://api.solyto.app"
          $env:PUBLIC_DESKTOP="true"
          $env:PUBLIC_VERSION=$env:GITHUB_REF_NAME.TrimStart('v')
          $env:PUBLIC_REDIRECT_AFTER_LOGOUT="/"
          npm run build

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build and publish
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          USE_SYSTEM_FPM: true
        run: npx electron-builder ${{ matrix.args }} --publish always

  publish-release:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
